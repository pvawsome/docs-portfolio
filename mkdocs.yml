# MkDocs config — OPTIONAL local preview only.
#
# The documentation IS the Markdown in docs/. Nothing here is published to GitHub Pages;
# this file exists so the same files can be previewed as a themed site locally:
#
#   pip install -r requirements.txt && mkdocs serve
#
# Note: the source uses GitHub-native callouts ("> [!NOTE]"), which a local MkDocs preview
# renders as plain blockquotes. GitHub renders them as proper callouts. GitHub is the
# primary reading surface.

site_name: Pavanraj Parthiban — Data & AI Documentation
site_description: >-
  Technical writing samples: data pipelines, SQL, and AI systems documented from
  hands-on engineering work rather than secondhand research.
repo_url: https://github.com/pvawsome/docs-portfolio
repo_name: pvawsome/docs-portfolio
edit_uri: edit/main/docs/
copyright: Pavanraj Parthiban

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - How this portfolio is built: about.md
  - Writing samples:
      - Overview: samples/index.md
      - "01 · A staging-to-typed SQL Server pipeline": samples/staging-to-typed-pipeline.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search
